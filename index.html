<!DOCTYPE html>
<html>
<head>
    <title>Task Tracker Login</title>
</head>

<body>
    <div class="login-container">

        <form>
            <input
                id="login-email"
                data-testid="input-email"
                type="email"
            />

            <input
                id="login-password"
                data-testid="input-password"
                type="password"
            />

            <button
                type="submit"
                data-testid="btn-submit-login"
            >
                Login
            </button>
        </form>

    </div>
</body>
</html>
